<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Területfoglalós Játék</title>
    <style>
        body {
            margin: 0;
            background-color: #1d1f21;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .player-info {
            position: absolute;
            color: white;
            font-size: 18px;
            top: 10px;
            left: 10px;
            display: flex;
            flex-direction: column;
        }

        .player-entry {
            margin-bottom: 5px;
            display: flex;
            align-items: center;
        }

        .color-box {
            width: 15px;
            height: 15px;
            margin-right: 10px;
        }

        .territory {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="playerList" class="player-info"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script type="module">
        import firebaseConfig from './firebaseConfig.js';

        // Firebase inicializálása
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let playerId = null;
        const playerColors = {};
        const territories = {};
        let playerListDiv = document.getElementById('playerList');
        const colors = ['rgba(0, 255, 0, 0.5)', 'rgba(255, 0, 0, 0.5)', 'rgba(0, 0, 255, 0.5)', 'rgba(255, 255, 0, 0.5)'];
        let usedColors = {};
        let lastClickTime = 0;

        // Felhasználói azonosítás
        const username = prompt("Add meg a felhasználóneved:");
        const userRef = db.ref(`players/${username}`);

        userRef.once('value').then(snapshot => {
            const playerData = snapshot.val();
            if (!playerData) {
                playerId = Date.now();
                const color = getUnusedColor();
                playerColors[username] = color;
                userRef.set({ playerId, score: 0, color, lastActive: Date.now() })
                    .then(() => console.log('Játékos sikeresen hozzáadva!'))
                    .catch((error) => console.error('Hiba a játékos hozzáadásakor:', error));
                userRef.onDisconnect().remove(); // Automatikus eltávolítás
            } else {
                playerId = playerData.playerId;
                playerColors[username] = playerData.color;
                userRef.update({ lastActive: Date.now() });
            }
            alert(`Üdv, ${username}!`);
        }).catch((error) => console.error('Hiba a játékos lekérdezésekor:', error));

        // Más játékosok aktivitásának figyelése
        db.ref('players').on('value', (snapshot) => {
            const players = snapshot.val();
            playerListDiv.innerHTML = '';
            for (const [name, data] of Object.entries(players)) {
                if (Date.now() - data.lastActive > 60000) {
                    db.ref(`players/${name}`).remove();
                    removePlayerTerritory(data.playerId);
                } else {
                    playerListDiv.innerHTML += createPlayerEntry(name, data.color);
                    usedColors[name] = data.color;
                }
            }
        });

        // Területfoglalás
        const container = document.getElementById('container');
        container.addEventListener('click', (e) => {
            const now = Date.now();
            if (!playerId || now - lastClickTime < 1000) return; // Limitálás másodpercenként
            lastClickTime = now;
            const x = e.clientX;
            const y = e.clientY;
            createTerritory(x, y, playerColors[username]);

            db.ref('clicks').push({
                x: x,
                y: y,
                player: playerId,
                timestamp: Date.now(),
                color: playerColors[username]
            });

            userRef.update({ lastActive: Date.now() });
        });

        // Területek megjelenítése más játékosok számára
        db.ref('clicks').on('child_added', (snapshot) => {
            const clickData = snapshot.val();
            const territory = createTerritory(clickData.x, clickData.y, clickData.color);
            if (!territories[clickData.player]) {
                territories[clickData.player] = [];
            }
            territories[clickData.player].push(territory);
        });

        // Terület létrehozása
        function createTerritory(x, y, color) {
            const territory = document.createElement('div');
            territory.classList.add('territory');
            territory.style.width = '50px';
            territory.style.height = '50px';
            territory.style.left = `${x - 25}px`;
            territory.style.top = `${y - 25}px`;
            territory.style.backgroundColor = color;
            container.appendChild(territory);
            return territory;
        }

        // Játékos belépésekor listához adás
        function createPlayerEntry(name, color) {
            return `<div class="player-entry"><div class="color-box" style="background-color:${color};"></div>${name}</div>`;
        }

        // Játékos területeinek eltávolítása
        function removePlayerTerritory(playerId) {
            if (territories[playerId]) {
                territories[playerId].forEach(t => t.remove());
                delete territories[playerId];
            }
        }

        // Szín kiosztása játékosnak
        function getUnusedColor() {
            for (const color of colors) {
                if (!Object.values(usedColors).includes(color)) {
                    return color;
                }
            }
            return 'rgba(255, 255, 255, 0.5)';
        }
    </script>
</body>
</html>
