<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Kattintós Játék</title>
    <style>
        body {
            margin: 0;
            background-color: #1d1f21;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            perspective: 1000px;
        }

        .text {
            position: absolute;
            font-size: 24px;
            color: #fff;
            opacity: 1;
            display: inline-block;
            transform-style: preserve-3d;
        }

        @keyframes explode {
            0% {
                transform: scale(1) rotateX(0) rotateY(0) rotateZ(0);
                opacity: 1;
            }
            100% {
                transform: scale(2) translateY(100vh) rotateX(720deg) rotateY(720deg) rotateZ(360deg);
                opacity: 0;
            }
        }

        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            animation: particle-move 1s ease-out forwards;
        }

        @keyframes particle-move {
            0% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--x), var(--y));
                opacity: 0;
            }
        }

        #player1, #player2 {
            position: absolute;
            color: white;
            font-size: 18px;
        }

        #player1 {
            top: 10px;
            left: 10px;
        }

        #player2 {
            top: 10px;
            right: 10px;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="player1">Player 1: <span id="score1">0</span></div>
    <div id="player2">Player 2: <span id="score2">0</span></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        // Firebase konfiguráció (Ezt a Firebase-ből másolhatod)
        const firebaseConfig = {
            apiKey: "AIzaSyAwjOVHoM1zFB26KCXKQRHHQyt5bWmqfEM",
            authDomain: "webgame-9d262.firebaseapp.com",
            databaseURL: "https://webgame-9d262-default-rtdb.firebaseio.com",
            projectId: "webgame-9d262",
            storageBucket: "webgame-9d262.appspot.com",
            messagingSenderId: "58124462561",
            appId: "1:58124462561:web:13e73b14bf30f0943dcaa0",
            measurementId: "G-DVN12051Y0"
        };
        
        // Firebase inicializálása
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const container = document.getElementById('container');
        let playerId = null;
        let score1 = 0;
        let score2 = 0;

        // Kezdeti játékosok száma
        db.ref('players').once('value').then(snapshot => {
            const players = snapshot.val();
            if (!players || Object.keys(players).length < 2) {
                playerId = Object.keys(players || {}).length + 1;
                db.ref(`players/player${playerId}`).set({ score: 0 });
                alert(`Te vagy a ${playerId}. játékos`);
            } else {
                alert("A játék már folyamatban van, csatlakozz később!");
            }
        });

        // Pontok frissítése valós időben
        db.ref('players').on('value', (snapshot) => {
            const players = snapshot.val();
            if (players) {
                score1 = players.player1?.score || 0;
                score2 = players.player2?.score || 0;
                document.getElementById('score1').innerText = score1;
                document.getElementById('score2').innerText = score2;
            }
        });

        // Kattintás események figyelése
        container.addEventListener('click', (e) => {
            if (!playerId) return;

            const x = e.clientX;
            const y = e.clientY;

            // Küldjük el az adatokat a Firebase-nek
            db.ref('clicks').push({
                x: x,
                y: y,
                player: playerId
            });

            // Frissítsük a játékos pontszámát
            if (playerId === 1) {
                score1 += 1;
                db.ref(`players/player1/score`).set(score1);
            } else if (playerId === 2) {
                score2 += 1;
                db.ref(`players/player2/score`).set(score2);
            }
        });

        // Robbanás effekt létrehozása a Firebase-ből kapott adatok alapján
        db.ref('clicks').on('child_added', (snapshot) => {
            const clickData = snapshot.val();
            createExplosion(clickData.x, clickData.y);
        });

        function createExplosion(x, y) {
            const text = document.createElement('div');
            text.classList.add('text');
            text.style.left = `${x}px`;
            text.style.top = `${y}px`;
            text.style.animation = `explode 1s ease-in-out forwards`;
            container.appendChild(text);

            // Részecskék robbanáshoz
            createParticles(text, x, y);

            // Eltávolítás animáció után
            setTimeout(() => {
                text.remove();
            }, 1000);
        }

        // Részecske effektek
        function createParticles(element, x, y) {
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;
                particle.style.setProperty('--x', `${Math.random() * 300 - 150}px`);
                particle.style.setProperty('--y', `${Math.random() * 300 - 150}px`);

                container.appendChild(particle);

                // Törlés az animáció után
                setTimeout(() => {
                    particle.remove();
                }, 1000);
            }
        }
    </script>
</body>
</html>
