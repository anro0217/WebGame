<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Labirintus Játék</title>
    <style>
        body {
            margin: 0;
            background-color: #1d1f21;
            font-family: Arial, sans-serif;
            color: white;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        .player {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: rgba(0, 255, 0, 0.5);
        }
        .wall {
            position: absolute;
            background-color: rgba(255, 0, 0, 0.5);
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button id="newGame">Új Játék</button>
        <input type="text" id="joinCode" placeholder="Játék kód">
        <button id="joinGame">Csatlakozás</button>
    </div>
    <div id="gameContainer"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script type="module">
        import firebaseConfig from './firebaseConfig.js';

        // Firebase inicializálása
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let playerId = null;
        let currentGameId = null;
        const players = {};
        const walls = [];
        const gameContainer = document.getElementById('gameContainer');
        
        document.getElementById('newGame').addEventListener('click', createNewGame);
        document.getElementById('joinGame').addEventListener('click', joinGame);

        function createNewGame() {
            currentGameId = generateGameId();
            db.ref(`games/${currentGameId}`).set({ players: {} });
            alert(`Új játék létrehozva! Kód: ${currentGameId}`);
        }

        function joinGame() {
            const code = document.getElementById('joinCode').value;
            db.ref(`games/${code}`).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    currentGameId = code;
                    startGame();
                } else {
                    alert('A megadott játék kód nem létezik.');
                }
            });
        }

        function startGame() {
            const username = prompt("Add meg a felhasználóneved:");
            playerId = Date.now();
            players[username] = { id: playerId, position: { x: 50, y: 50 } };
            db.ref(`games/${currentGameId}/players/${username}`).set(players[username]);

            db.ref(`games/${currentGameId}/players`).on('value', (snapshot) => {
                gameContainer.innerHTML = ''; // Törli a régi játékosokat
                snapshot.forEach(playerSnapshot => {
                    const playerData = playerSnapshot.val();
                    createPlayer(playerData.position.x, playerData.position.y);
                });
            });

            generateMaze();
            document.addEventListener('keydown', handleKeyPress);
        }

        function generateMaze() {
            // Labirintus generálás (itt csak egy egyszerű példa, valóságbeli algoritmust használj)
            for (let i = 0; i < 10; i++) {
                for (let j = 0; j < 10; j++) {
                    if (Math.random() < 0.2) { // 20% eséllyel fal
                        const wall = document.createElement('div');
                        wall.classList.add('wall');
                        wall.style.width = '20px';
                        wall.style.height = '20px';
                        wall.style.left = `${j * 20}px`;
                        wall.style.top = `${i * 20}px`;
                        gameContainer.appendChild(wall);
                        walls.push({ x: j * 20, y: i * 20 });
                    }
                }
            }
        }

        function createPlayer(x, y) {
            const playerDiv = document.createElement('div');
            playerDiv.classList.add('player');
            playerDiv.style.left = `${x}px`;
            playerDiv.style.top = `${y}px`;
            gameContainer.appendChild(playerDiv);
        }

        function handleKeyPress(e) {
            const direction = { x: 0, y: 0 };
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                    direction.y = -20;
                    break;
                case 'ArrowDown':
                case 's':
                    direction.y = 20;
                    break;
                case 'ArrowLeft':
                case 'a':
                    direction.x = -20;
                    break;
                case 'ArrowRight':
                case 'd':
                    direction.x = 20;
                    break;
                default:
                    return; // Nem kezeli más billentyűt
            }

            movePlayer(direction);
        }

        function movePlayer(direction) {
            const username = Object.keys(players)[0]; // Az első játékos (jelenleg egy játékos)
            const player = players[username];
            const newPosition = {
                x: player.position.x + direction.x,
                y: player.position.y + direction.y
            };

            // Ellenőrzés, hogy nem ütközik falba
            const collision = walls.some(wall => wall.x === newPosition.x && wall.y === newPosition.y);
            if (!collision) {
                player.position = newPosition;
                db.ref(`games/${currentGameId}/players/${username}`).set(player);
                gameContainer.innerHTML = ''; // Törli a régi játékost
                createPlayer(newPosition.x, newPosition.y);
            }
            checkWinCondition(newPosition);
        }

        function checkWinCondition(position) {
            // Kijutás ellenőrzése (pl. ha a position.x, position.y a kijutási pont)
            if (position.x === 180 && position.y === 180) { // Példa kijutási koordináták
                alert('Gratulálunk! Győztél!');
                // Itt lehetne új játékot indítani, ha a gombot megnyomják
            }
        }

        function generateGameId() {
            return Math.random().toString(36).substring(2, 8); // Egyszerű kód generálás
        }
    </script>
</body>
</html>
