<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Labirintus Játék</title>
    <style>
        body {
            margin: 0;
            background-color: #1d1f21;
            font-family: Arial, sans-serif;
            color: white;
            overflow: hidden; /* Ne legyen görgetés */
        }
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100vh;
            max-width: 800px;
            max-height: 800px;
            margin: 0 auto;
            display: none;
        }
        .player {
            position: absolute;
            width: 20px;
            height: 20px;
        }
        .wall {
            position: absolute;
            background-color: rgba(255, 0, 0, 0.5);
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
        }
        #lobby {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
        }
        #playerList {
            position: fixed;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="controls">
        <input type="text" id="username" placeholder="Felhasználónév">
        <button id="newGame">Új Játék</button>
        <input type="text" id="joinCode" placeholder="Játék kód">
        <button id="joinGame">Csatlakozás</button>
    </div>
    <div id="lobby" style="display: none;">
        <h2>Lobby</h2>
        <p id="lobbyPlayers">Várakozás a játékosokra...</p>
        <p id="gameCode"></p>
        <button id="startGame">Játék Indítása</button>
    </div>
    <div id="playerList"></div>
    <div id="gameContainer"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script type="module">
        import firebaseConfig from './firebaseConfig.js';
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let playerId = null;
        let currentGameId = null;
        const players = {};
        const walls = [];
        const gameContainer = document.getElementById('gameContainer');
        const lobby = document.getElementById('lobby');
        const playerList = document.getElementById('playerList');

        document.getElementById('newGame').addEventListener('click', createNewGame);
        document.getElementById('joinGame').addEventListener('click', joinGame);
        document.getElementById('startGame').addEventListener('click', startGameFromLobby);

        function createNewGame() {
            const username = document.getElementById('username').value;
            if (!username) {
                alert('Kérlek, adj meg egy felhasználónevet!');
                return;
            }
            currentGameId = generateGameId();
            db.ref(`games/${currentGameId}`).set({ players: {}, started: false, creator: username });
            document.getElementById('gameCode').innerText = `Csatlakozási kód: ${currentGameId}`;
            enterLobby(username);
        }

        function joinGame() {
            const code = document.getElementById('joinCode').value;
            const username = document.getElementById('username').value;
            if (!username) {
                alert('Kérlek, adj meg egy felhasználónevet!');
                return;
            }
            db.ref(`games/${code}`).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    currentGameId = code;
                    document.getElementById('gameCode').innerText = `Csatlakozási kód: ${currentGameId}`;
                    enterLobby(username);
                } else {
                    alert('A megadott játék kód nem létezik.');
                }
            });
        }

        function enterLobby(username) {
            document.getElementById('controls').style.display = 'none';
            lobby.style.display = 'block';

            db.ref(`games/${currentGameId}/creator`).once('value').then(snapshot => {
                const creator = snapshot.val();
                document.getElementById('startGame').style.display = (username === creator) ? 'block' : 'none';
            });

            addPlayerToLobby(username);
            listenForPlayers();
        }

        function addPlayerToLobby(username) {
            const color = getRandomColor();
            playerId = Date.now();
            players[username] = { id: playerId, position: { x: 50, y: 50 }, color: color, inGame: false };
            db.ref(`games/${currentGameId}/players/${username}`).set(players[username]);
        }

        function listenForPlayers() {
            db.ref(`games/${currentGameId}/players`).on('value', (snapshot) => {
                const playerNames = [];
                snapshot.forEach(playerSnapshot => {
                    const playerData = playerSnapshot.val();
                    playerNames.push(`${playerSnapshot.key} (szín: ${playerData.color})`);
                });
                document.getElementById('lobbyPlayers').innerText = `Játékosok: ${playerNames.join(', ')}`;
            });
        }

        function startGameFromLobby() {
            if (currentGameId) {
                db.ref(`games/${currentGameId}`).update({ started: true })
                    .then(() => {
                        console.log('A játék elindult.');
                        // Set all players' 'inGame' state to true
                        db.ref(`games/${currentGameId}/players`).once('value').then((snapshot) => {
                            snapshot.forEach(playerSnapshot => {
                                const username = playerSnapshot.key;
                                db.ref(`games/${currentGameId}/players/${username}`).update({ inGame: true });
                            });
                        });
                        listenForGameStart();
                    })
                    .catch((error) => {
                        console.error('Hiba a játék indításakor:', error);
                    });
            }
        }

        function listenForGameStart() {
            db.ref(`games/${currentGameId}`).on('value', (snapshot) => {
                const gameData = snapshot.val();
                if (gameData && gameData.started) {
                    console.log('A játék elkezdődött');
                    const username = document.getElementById('username').value;
                    db.ref(`games/${currentGameId}/players/${username}`).once('value').then((snapshot) => {
                        const playerData = snapshot.val();
                        if (playerData && playerData.inGame) {
                            lobby.style.display = 'none'; 
                            gameContainer.style.display = 'block'; 
                            startGame();
                        }
                    });
                }
            });
        }

        function startGame() {
            generateMaze();
            loadPlayers();
            document.addEventListener('keydown', handleKeyPress);
        }

        function loadPlayers() {
            db.ref(`games/${currentGameId}/players`).once('value').then((snapshot) => {
                snapshot.forEach(playerSnapshot => {
                    const playerData = playerSnapshot.val();
                    createPlayer(playerData.position.x, playerData.position.y, playerData.color);
                });
            });
        }

        function generateMaze() {
            gameContainer.style.position = 'relative';
            gameContainer.style.left = `calc(50% - 100px)`;
            gameContainer.style.top = `calc(50% - 100px)`;

            for (let i = 0; i < 10; i++) {
                for (let j = 0; j < 10; j++) {
                    if (Math.random() < 0.2) {
                        const wall = document.createElement('div');
                        wall.classList.add('wall');
                        wall.style.width = '20px';
                        wall.style.height = '20px';
                        wall.style.left = `${j * 20}px`;
                        wall.style.top = `${i * 20}px`;
                        gameContainer.appendChild(wall);
                        walls.push({ x: j * 20, y: i * 20 });
                    }
                }
            }

            const exit = document.createElement('div');
            exit.classList.add('wall');
            exit.style.width = '20px';
            exit.style.height = '20px';
            exit.style.left = `180px`;
            exit.style.top = `180px`;
            gameContainer.appendChild(exit);
            walls.push({ x: 180, y: 180 });
        }

        function createPlayer(x, y, color) {
            const playerElement = document.createElement('div');
            playerElement.classList.add('player');
            playerElement.style.backgroundColor = color;
            playerElement.style.left = `${x}px`;
            playerElement.style.top = `${y}px`;
            gameContainer.appendChild(playerElement);
        }

        function handleKeyPress(event) {
            const username = document.getElementById('username').value;
            const moveAmount = 20;
            let x = players[username].position.x;
            let y = players[username].position.y;

            switch (event.key) {
                case 'ArrowUp':
                case 'w':
                    y -= moveAmount;
                    break;
                case 'ArrowDown':
                case 's':
                    y += moveAmount;
                    break;
                case 'ArrowLeft':
                case 'a':
                    x -= moveAmount;
                    break;
                case 'ArrowRight':
                case 'd':
                    x += moveAmount;
                    break;
            }

            // Ellenőrizzük a falakat
            if (!checkWallCollision(x, y)) {
                players[username].position.x = x;
                players[username].position.y = y;
                db.ref(`games/${currentGameId}/players/${username}/position`).set(players[username].position);
            }
        }

        function checkWallCollision(x, y) {
            return walls.some(wall => wall.x === x && wall.y === y);
        }

        function generateGameId() {
            return Math.random().toString(36).substring(2, 8).toUpperCase();
        }

        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }
    </script>
</body>
</html>
