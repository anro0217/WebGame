<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Ugráló Játék</title>
    <style>
        body {
            margin: 0;
            background-color: #1d1f21;
            font-family: Arial, sans-serif;
            color: white;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100vh;
            max-width: 800px;
            margin: 0 auto;
            display: none;
            overflow: hidden;
        }
        .player {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #00ff00;
            bottom: 0;
            transition: bottom 0.2s ease, height 0.2s ease;
        }
        .ground {
            position: absolute;
            width: 100%;
            height: 20px;
            background-color: #654321;
            bottom: 0;
        }
        .obstacle {
            position: absolute;
            background-color: rgba(255, 0, 0, 0.7);
            animation: moveObstacle 5s linear infinite;
        }
        @keyframes moveObstacle {
            from { transform: translateX(800px); }
            to { transform: translateX(-100px); }
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
        }
        #lobby {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
        }
        #playerList {
            position: fixed;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="controls">
        <input type="text" id="username" placeholder="Felhasználónév">
        <button id="newGame">Új Játék</button>
        <input type="text" id="joinCode" placeholder="Játék kód">
        <button id="joinGame">Csatlakozás</button>
    </div>
    <div id="lobby" style="display: none;">
        <h2>Lobby</h2>
        <p id="lobbyPlayers">Várakozás a játékosokra...</p>
        <p id="gameCode"></p>
        <button id="startGame" style="display: none;">Játék Indítása</button>
    </div>
    <div id="playerList"></div>
    <div id="gameContainer">
        <div class="ground"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script type="module">
        import firebaseConfig from './firebaseConfig.js';
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let playerId = null;
        let currentGameId = null;
        const players = {};
        const gameContainer = document.getElementById('gameContainer');
        const lobby = document.getElementById('lobby');

        document.getElementById('newGame').addEventListener('click', createNewGame);
        document.getElementById('joinGame').addEventListener('click', joinGame);
        document.getElementById('startGame').addEventListener('click', startGameFromLobby);

        function createNewGame() {
            const username = document.getElementById('username').value;
            if (!username) {
                alert('Kérlek, adj meg egy felhasználónevet!');
                return;
            }
            currentGameId = generateGameId();
            db.ref(`games/${currentGameId}`).set({ players: {}, started: false, creator: username });
            document.getElementById('gameCode').innerText = `Csatlakozási kód: ${currentGameId}`;
            enterLobby(username);
        }

        function joinGame() {
            const code = document.getElementById('joinCode').value;
            const username = document.getElementById('username').value;
            if (!username) {
                alert('Kérlek, adj meg egy felhasználónevet!');
                return;
            }
            db.ref(`games/${code}`).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    currentGameId = code;
                    document.getElementById('gameCode').innerText = `Csatlakozási kód: ${currentGameId}`;
                    enterLobby(username);
                } else {
                    alert('A megadott játék kód nem létezik.');
                }
            });
        }

        function enterLobby(username) {
            document.getElementById('controls').style.display = 'none';
            lobby.style.display = 'block';

            db.ref(`games/${currentGameId}/creator`).once('value').then(snapshot => {
                const creator = snapshot.val();
                document.getElementById('startGame').style.display = (username === creator) ? 'block' : 'none';
            });

            addPlayerToLobby(username);
            listenForPlayers();
        }

        function addPlayerToLobby(username) {
            playerId = Date.now();
            players[username] = { id: playerId, position: { x: 50, y: 0 }, inGame: false };
            db.ref(`games/${currentGameId}/players/${username}`).set(players[username]);
        }

        function listenForPlayers() {
            db.ref(`games/${currentGameId}/players`).on('value', (snapshot) => {
                const playerNames = [];
                snapshot.forEach(playerSnapshot => {
                    const playerData = playerSnapshot.val();
                    playerNames.push(playerSnapshot.key);
                });
                document.getElementById('lobbyPlayers').innerText = `Játékosok: ${playerNames.join(', ')}`;
            });
        }

        function startGameFromLobby() {
            if (currentGameId) {
                db.ref(`games/${currentGameId}`).update({ started: true })
                    .then(() => {
                        console.log('A játék elindult.');
                        redirectAllPlayersToGame();
                    })
                    .catch((error) => {
                        console.error('Hiba a játék indításakor:', error);
                    });
            }
        }

        function redirectAllPlayersToGame() {
    db.ref(`games/${currentGameId}/players`).once('value').then((snapshot) => {
        snapshot.forEach(playerSnapshot => {
            const username = playerSnapshot.key;
            db.ref(`games/${currentGameId}/players/${username}`).update({ inGame: true })
                .then(() => {
                    // Itt is elrejtheted a lobby nézetet minden játékosnál
                    lobby.style.display = 'none';
                    gameContainer.style.display = 'block'; // A játék megnyitása
                });
        });
    });
    listenForGameStart();
}

        function listenForGameStart() {
            db.ref(`games/${currentGameId}`).on('value', (snapshot) => {
                const gameData = snapshot.val();
                if (gameData && gameData.started) {
                    console.log('A játék elkezdődött');
                    loadAllPlayers(); // Minden játékos állapotának betöltése
                }
            });
        }

        function loadAllPlayers() {
    db.ref(`games/${currentGameId}/players`).once('value').then((snapshot) => {
        snapshot.forEach(playerSnapshot => {
            const playerData = playerSnapshot.val();
            if (playerData.inGame) {
                createPlayer(playerSnapshot.key);
            }
        });
        gameContainer.style.display = 'block'; // A játék megnyitása
        startGame(); // A játék elindítása
    });
}


        function startGame() {
            generateObstacles();
            document.addEventListener('keydown', handleKeyPress);
        }

        function generateObstacles() {
            setInterval(() => {
                const obstacle = document.createElement('div');
                obstacle.classList.add('obstacle');
                obstacle.style.width = `${Math.random() * 40 + 20}px`;
                obstacle.style.height = Math.random() > 0.5 ? '20px' : '10px'; // Változó magasságú akadályok
                obstacle.style.bottom = '20px';
                obstacle.style.left = '800px'; // Kezdeti pozíció
                gameContainer.appendChild(obstacle);
            }, 2000); // Minden 2 másodpercben új akadály
        }

        function handleKeyPress(event) {
            const player = document.querySelector('.player');
            if (event.key === 'ArrowUp') {
                player.style.bottom = '60px'; // Ugrás
                setTimeout(() => { player.style.bottom = '0px'; }, 300); // Visszaesés
            } else if (event.key === 'ArrowDown') {
                player.style.height = '10px'; // Guggolás
                setTimeout(() => { player.style.height = '20px'; }, 300); // Visszaállás
            }
        }

        function createPlayer(username) {
            const player = document.createElement('div');
            player.classList.add('player');
            player.style.left = '50%'; // Középen kezd
            player.style.backgroundColor = getRandomColor();
            gameContainer.appendChild(player);
            players[username] = player;
        }

        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }

        function generateGameId() {
            return Math.random().toString(36).substr(2, 6);
        }
    </script>
</body>
</html>
