<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Labirintus Játék</title>
    <style>
        body {
            margin: 0;
            background-color: #1d1f21;
            font-family: Arial, sans-serif;
            color: white;
            overflow: hidden; /* Ne legyen görgetés */
        }
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100vh;
            max-width: 800px;
            max-height: 800px;
            margin: 0 auto;
            display: none;
        }
        .player {
            position: absolute;
            width: 20px;
            height: 20px;
        }
        .wall {
            position: absolute;
            background-color: rgba(255, 0, 0, 0.5);
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
        }
        #lobby {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
        }
        #playerList {
            position: fixed;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="controls">
        <input type="text" id="username" placeholder="Felhasználónév">
        <button id="newGame">Új Játék</button>
        <input type="text" id="joinCode" placeholder="Játék kód">
        <button id="joinGame">Csatlakozás</button>
    </div>
    <div id="lobby" style="display: none;">
        <h2>Lobby</h2>
        <p id="lobbyPlayers">Várakozás a játékosokra...</p>
        <p id="gameCode"></p>
        <button id="startGame" style="display: none;">Játék Indítása</button>
    </div>
    <div id="playerList"></div>
    <div id="gameContainer"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script type="module">
        import firebaseConfig from './firebaseConfig.js';
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let playerId = null;
        let currentGameId = null;
        const players = {};
        const walls = [];
        const gameContainer = document.getElementById('gameContainer');
        const lobby = document.getElementById('lobby');
        const playerList = document.getElementById('playerList');

        document.getElementById('newGame').addEventListener('click', createNewGame);
        document.getElementById('joinGame').addEventListener('click', joinGame);
        document.getElementById('startGame').addEventListener('click', startGameFromLobby);

        function createNewGame() {
            const username = document.getElementById('username').value;
            if (!username) {
                alert('Kérlek, adj meg egy felhasználónevet!');
                return;
            }
            currentGameId = generateGameId();
            db.ref(`games/${currentGameId}`).set({ players: {}, started: false, creator: username });
            document.getElementById('gameCode').innerText = `Csatlakozási kód: ${currentGameId}`;
            enterLobby(username);
        }

        function joinGame() {
            const code = document.getElementById('joinCode').value;
            const username = document.getElementById('username').value;
            if (!username) {
                alert('Kérlek, adj meg egy felhasználónevet!');
                return;
            }
            db.ref(`games/${code}`).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    currentGameId = code;
                    document.getElementById('gameCode').innerText = `Csatlakozási kód: ${currentGameId}`;
                    enterLobby(username);
                } else {
                    alert('A megadott játék kód nem létezik.');
                }
            });
        }

        function enterLobby(username) {
            document.getElementById('controls').style.display = 'none';
            lobby.style.display = 'block';

            db.ref(`games/${currentGameId}/creator`).once('value').then(snapshot => {
                const creator = snapshot.val();
                document.getElementById('startGame').style.display = (username === creator) ? 'block' : 'none';
            });

            addPlayerToLobby(username);
            listenForPlayers();
        }

        function addPlayerToLobby(username) {
            const color = getRandomColor();
            playerId = Date.now();
            players[username] = { id: playerId, position: { x: 50, y: 50 }, color: color, inGame: false };
            db.ref(`games/${currentGameId}/players/${username}`).set(players[username]);
        }

        function listenForPlayers() {
            db.ref(`games/${currentGameId}/players`).on('value', (snapshot) => {
                const playerNames = [];
                snapshot.forEach(playerSnapshot => {
                    const playerData = playerSnapshot.val();
                    playerNames.push(`${playerSnapshot.key} (szín: ${playerData.color})`);
                });
                document.getElementById('lobbyPlayers').innerText = `Játékosok: ${playerNames.join(', ')}`;
            });
        }

        function startGameFromLobby() {
            if (currentGameId) {
                db.ref(`games/${currentGameId}`).update({ started: true })
                    .then(() => {
                        console.log('A játék elindult.');
                        redirectAllPlayersToGame();
                    })
                    .catch((error) => {
                        console.error('Hiba a játék indításakor:', error);
                    });
            }
        }

        function redirectAllPlayersToGame() {
            db.ref(`games/${currentGameId}/players`).once('value').then((snapshot) => {
                snapshot.forEach(playerSnapshot => {
                    const username = playerSnapshot.key;
                    db.ref(`games/${currentGameId}/players/${username}`).update({ inGame: true });
                    loadAllPlayers(username); // Minden játékos átirányítása a játék felületére
                });
            });
            listenForGameStart();
        }

        function listenForGameStart() {
            db.ref(`games/${currentGameId}`).on('value', (snapshot) => {
                const gameData = snapshot.val();
                if (gameData && gameData.started) {
                    console.log('A játék elkezdődött');
                    loadAllPlayers(); // Minden játékos állapotának betöltése
                }
            });
        }

        function loadAllPlayers(username) {
            db.ref(`games/${currentGameId}/players`).once('value').then((snapshot) => {
                snapshot.forEach(playerSnapshot => {
                    const playerData = playerSnapshot.val();
                    if (playerData.inGame) {
                        createPlayer(playerData.position.x, playerData.position.y, playerData.color);
                    }
                });
                lobby.style.display = 'none'; 
                gameContainer.style.display = 'block'; 
                startGame(); // A játék elindítása
            });
        }

        function startGame() {
            generateMaze();
            document.addEventListener('keydown', handleKeyPress);
        }

        function generateMaze() {
            gameContainer.style.position = 'relative';
            gameContainer.style.left = `calc(50% - 100px)`;
            gameContainer.style.top = `calc(50% - 100px)`;

            for (let i = 0; i < 10; i++) {
                for (let j = 0; j < 10; j++) {
                    if (Math.random() < 0.2) {
                        const wall = document.createElement('div');
                        wall.classList.add('wall');
                        wall.style.width = '20px';
                        wall.style.height = '20px';
                        wall.style.left = `${j * 20}px`;
                        wall.style.top = `${i * 20}px`;
                        gameContainer.appendChild(wall);
                        walls.push({ x: j * 20, y: i * 20 });
                    }
                }
            }

            const exit = document.createElement('div');
            exit.classList.add('wall');
            exit.style.width = '20px';
            exit.style.height = '20px';
            exit.style.left = `180px`;
            exit.style.top = `180px`;
            gameContainer.appendChild(exit);
            walls.push({ x: 180, y: 180 });
        }

        function createPlayer(x, y, color) {
            const playerDiv = document.createElement('div');
            playerDiv.classList.add('player');
            playerDiv.style.backgroundColor = color;
            playerDiv.style.left = `${x}px`;
            playerDiv.style.top = `${y}px`;
            gameContainer.appendChild(playerDiv);
        }

        function handleKeyPress(event) {
            const player = players[Object.keys(players)[0]];
            switch (event.key) {
                case 'ArrowUp':
                    movePlayer(player, 0, -20);
                    break;
                case 'ArrowDown':
                    movePlayer(player, 0, 20);
                    break;
                case 'ArrowLeft':
                    movePlayer(player, -20, 0);
                    break;
                case 'ArrowRight':
                    movePlayer(player, 20, 0);
                    break;
            }
        }

        function movePlayer(player, dx, dy) {
            const newX = player.position.x + dx;
            const newY = player.position.y + dy;
            if (!checkCollision(newX, newY)) {
                player.position.x = newX;
                player.position.y = newY;
                db.ref(`games/${currentGameId}/players/${Object.keys(players)[0]}`).update({ position: player.position });
                updatePlayerPositionInDOM(player);
            }
        }

        function checkCollision(x, y) {
            return walls.some(wall => wall.x === x && wall.y === y);
        }

        function updatePlayerPositionInDOM(player) {
            const playerDiv = document.querySelector(`.player[style*="background-color: ${player.color};"]`);
            if (playerDiv) {
                playerDiv.style.left = `${player.position.x}px`;
                playerDiv.style.top = `${player.position.y}px`;
            }
        }

        function generateGameId() {
            return Math.random().toString(36).substring(2, 8);
        }

        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }
    </script>
</body>
</html>
