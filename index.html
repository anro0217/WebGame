<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Területfoglalós Játék</title>
    <style>
        body {
            margin: 0;
            background-color: #1d1f21;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .player-info {
            position: absolute;
            color: white;
            font-size: 18px;
        }

        #player1 {
            top: 10px;
            left: 10px;
        }

        #player2 {
            top: 10px;
            right: 10px;
        }

        .territory {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="player1" class="player-info">Player 1: <span id="score1">0</span></div>
    <div id="player2" class="player-info">Player 2: <span id="score2">0</span></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        // Firebase konfiguráció (használj saját Firebase adataidat)
        const firebaseConfig = {
            apiKey: "API_KEY",
            authDomain: "webgame-9d262.firebaseapp.com",
            databaseURL: "https://webgame-9d262-default-rtdb.firebaseio.com",
            projectId: "webgame-9d262",
            storageBucket: "webgame-9d262.appspot.com",
            messagingSenderId: "58124462561",
            appId: "1:58124462561:web:13e73b14bf30f0943dcaa0",
            measurementId: "G-DVN12051Y0"
        };

        // Firebase inicializálása
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let playerId = null;
        let score1 = 0;
        let score2 = 0;

        // Felhasználói azonosítás
        const username = prompt("Add meg a felhasználóneved:");

        db.ref('players').once('value').then(snapshot => {
            const players = snapshot.val();
            if (!players || !players[username]) {
                playerId = Object.keys(players || {}).length + 1;
                db.ref(`players/${username}`).set({ score: 0, playerId });
                alert(`Te vagy a ${playerId}. játékos`);
            } else {
                playerId = players[username].playerId;
                alert(`Üdv újra, ${username}!`);
            }
        });

        // Pontok frissítése
        db.ref('players').on('value', (snapshot) => {
            const players = snapshot.val();
            if (players) {
                score1 = players.player1?.score || 0;
                score2 = players.player2?.score || 0;
                document.getElementById('score1').innerText = score1;
                document.getElementById('score2').innerText = score2;
            }
        });

        const container = document.getElementById('container');

        // Terület foglalása kattintással
        container.addEventListener('click', (e) => {
            if (!playerId) return;

            const x = e.clientX;
            const y = e.clientY;

            // Terület létrehozása
            const territory = document.createElement('div');
            territory.classList.add('territory');
            territory.style.width = '50px';
            territory.style.height = '50px';
            territory.style.left = `${x - 25}px`;
            territory.style.top = `${y - 25}px`;
            territory.style.backgroundColor = playerId === 1 ? 'rgba(0, 255, 0, 0.5)' : 'rgba(255, 0, 0, 0.5)';
            container.appendChild(territory);

            // Frissítjük a Firebase adatbázist
            db.ref('clicks').push({
                x: x,
                y: y,
                player: playerId,
                timestamp: Date.now()
            });

            // Frissítjük a játékos pontszámát
            if (playerId === 1) {
                score1 += 1;
                db.ref(`players/player1/score`).set(score1);
            } else {
                score2 += 1;
                db.ref(`players/player2/score`).set(score2);
            }
        });

        // Másik játékos területfoglalásának megjelenítése
        db.ref('clicks').on('child_added', (snapshot) => {
            const clickData = snapshot.val();
            createTerritory(clickData.x, clickData.y, clickData.player);
        });

        function createTerritory(x, y, player) {
            const territory = document.createElement('div');
            territory.classList.add('territory');
            territory.style.width = '50px';
            territory.style.height = '50px';
            territory.style.left = `${x - 25}px`;
            territory.style.top = `${y - 25}px`;
            territory.style.backgroundColor = player === 1 ? 'rgba(0, 255, 0, 0.5)' : 'rgba(255, 0, 0, 0.5)';
            container.appendChild(territory);
        }
    </script>
</body>
</html>
