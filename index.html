<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Labirintus Játék</title>
    <style>
        body {
            margin: 0;
            background-color: #1d1f21;
            font-family: Arial, sans-serif;
            color: white;
            position: relative;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: none; /* Kezdetben rejtve */
        }
        .player {
            position: absolute;
            width: 20px;
            height: 20px;
        }
        .wall {
            position: absolute;
            background-color: rgba(255, 0, 0, 0.5);
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
        }
        #lobby {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button id="newGame">Új Játék</button>
        <input type="text" id="joinCode" placeholder="Játék kód">
        <button id="joinGame">Csatlakozás</button>
    </div>
    <div id="lobby" style="display: none;">
        <h2>Lobby</h2>
        <p id="lobbyPlayers">Várakozás a játékosokra...</p>
        <p id="gameCode"></p> <!-- Játék kód megjelenítése -->
        <button id="startGame">Játék Indítása</button>
    </div>
    <div id="gameContainer"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script type="module">
        import firebaseConfig from './firebaseConfig.js';

        // Firebase inicializálása
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let playerId = null;
        let currentGameId = null;
        const players = {};
        const walls = [];
        const gameContainer = document.getElementById('gameContainer');
        const lobby = document.getElementById('lobby');
        
        document.getElementById('newGame').addEventListener('click', createNewGame);
        document.getElementById('joinGame').addEventListener('click', joinGame);
        document.getElementById('startGame').addEventListener('click', startGameFromLobby);

        function createNewGame() {
            currentGameId = generateGameId();
            db.ref(`games/${currentGameId}`).set({ players: {} });
            document.getElementById('gameCode').innerText = `Csatlakozási kód: ${currentGameId}`; // Kód megjelenítése
            enterLobby(); // Belépés a lobbyba
        }

        function joinGame() {
            const code = document.getElementById('joinCode').value;
            db.ref(`games/${code}`).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    currentGameId = code;
                    document.getElementById('gameCode').innerText = `Csatlakozási kód: ${currentGameId}`; // Kód megjelenítése
                    enterLobby(); // Belépés a lobbyba
                } else {
                    alert('A megadott játék kód nem létezik.');
                }
            });
        }

        function enterLobby() {
            document.getElementById('controls').style.display = 'none'; // Vezérlők elrejtése
            lobby.style.display = 'block'; // Lobby megjelenítése
            listenForPlayers(); // Játékosok figyelése
        }

        function listenForPlayers() {
            db.ref(`games/${currentGameId}/players`).on('value', (snapshot) => {
                const playerNames = [];
                snapshot.forEach(playerSnapshot => {
                    const playerData = playerSnapshot.val();
                    playerNames.push(`${playerSnapshot.key} (szín: ${playerData.color})`);
                });
                document.getElementById('lobbyPlayers').innerText = `Játékosok: ${playerNames.join(', ')}`;
            });
        }

        function startGameFromLobby() {
            const username = prompt("Add meg a felhasználóneved:");
            const color = getRandomColor(); // Véletlenszerű szín generálása
            playerId = Date.now();
            players[username] = { id: playerId, position: { x: 50, y: 50 }, color: color };
            db.ref(`games/${currentGameId}/players/${username}`).set(players[username]);
            lobby.style.display = 'none'; // Lobby elrejtése
            gameContainer.style.display = 'block'; // Játék területének megjelenítése
            startGame();
        }

        function startGame() {
            generateMaze(); // Labirintus generálás
            db.ref(`games/${currentGameId}/players`).on('value', (snapshot) => {
                gameContainer.innerHTML = ''; // Törli a régi játékosokat
                snapshot.forEach(playerSnapshot => {
                    const playerData = playerSnapshot.val();
                    createPlayer(playerData.position.x, playerData.position.y, playerData.color);
                });
            });

            document.addEventListener('keydown', handleKeyPress);
        }

        function generateMaze() {
            // Egyszerű labirintus generálás algoritmus
            for (let i = 0; i < 10; i++) {
                for (let j = 0; j < 10; j++) {
                    if (Math.random() < 0.2) { // 20% eséllyel fal
                        const wall = document.createElement('div');
                        wall.classList.add('wall');
                        wall.style.width = '20px';
                        wall.style.height = '20px';
                        wall.style.left = `${j * 20}px`;
                        wall.style.top = `${i * 20}px`;
                        gameContainer.appendChild(wall);
                        walls.push({ x: j * 20, y: i * 20 });
                    }
                }
            }
            // Kijutási pont hozzáadása
            const exit = document.createElement('div');
            exit.classList.add('wall');
            exit.style.width = '20px';
            exit.style.height = '20px';
            exit.style.left = `180px`; // Kijutási koordináták
            exit.style.top = `180px`;
            gameContainer.appendChild(exit);
            walls.push({ x: 180, y: 180 });
        }

        function createPlayer(x, y, color) {
            const playerDiv = document.createElement('div');
            playerDiv.classList.add('player');
            playerDiv.style.backgroundColor = color; // Játékos szín
            playerDiv.style.left = `${x}px`;
            playerDiv.style.top = `${y}px`;
            gameContainer.appendChild(playerDiv);
        }

        function handleKeyPress(e) {
            const direction = { x: 0, y: 0 };
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                    direction.y = -20;
                    break;
                case 'ArrowDown':
                case 's':
                    direction.y = 20;
                    break;
                case 'ArrowLeft':
                case 'a':
                    direction.x = -20;
                    break;
                case 'ArrowRight':
                case 'd':
                    direction.x = 20;
                    break;
                default:
                    return; // Nem kezeli más billentyűt
            }

            movePlayer(direction);
        }

        function movePlayer(direction) {
            const username = Object.keys(players)[0]; // Az első játékos (jelenleg egy játékos)
            const player = players[username];
            const newPosition = {
                x: player.position.x + direction.x,
                y: player.position.y + direction.y
            };

            // Ellenőrzés, hogy nem ütközik falba
            const collision = walls.some(wall => wall.x === newPosition.x && wall.y === newPosition.y);
            if (!collision) {
                player.position = newPosition;
                db.ref(`games/${currentGameId}/players/${username}`).set(player);
            }
        }

        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }

        function generateGameId() {
            return Math.random().toString(36).substr(2, 5); // Rövid játék kód generálása
        }
    </script>
</body>
</html>
