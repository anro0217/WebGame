<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Labirintus Játék</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="controls">
        <input type="text" id="username" placeholder="Felhasználónév" required>
        <button id="newGame">Új Játék</button>
        <input type="text" id="joinCode" placeholder="Játék kód" required>
        <button id="joinGame">Csatlakozás</button>
    </div>
    <div id="lobby" style="display: none;">
        <h2>Lobby</h2>
        <p id="lobbyPlayers">Várakozás a játékosokra...</p>
        <p id="gameCode"></p>
        <button id="startGame" style="display: none;">Játék Indítása</button>
    </div>
    <div id="playerList"></div>
    <div id="gameContainer" style="display: none;"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
